name: Fail-Closed Quality and Security Gate
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  terraform_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
        working-directory: infrastructure
      - run: terraform fmt -check -recursive
        working-directory: infrastructure
      - run: terraform validate
        working-directory: infrastructure

  python_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - run: black --check backend
      - run: ruff check backend

  secret_detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on prohibited hardcoded secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude="*.md" --exclude="insecure_example.txt" -E '(API_KEY|SECRET_KEY|PRIVATE_KEY|PASSWORD)[[:space:]]*=[[:space:]]*["'\''][^"'\'']{8,}|AIza[0-9A-Za-z_-]{20,}' .; then
            echo "SECURITY FAILURE: prohibited hardcoded secret pattern detected."
            exit 1
          fi

  python_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests

  infrastructure_security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infrastructure
          exit-code: "1"
          severity: HIGH,CRITICAL

  deployment_eligibility:
    needs: [terraform_validation, python_quality, secret_detection, python_tests, infrastructure_security]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "All gates passed."
          echo "Build is eligible for an approved deployment stage."
